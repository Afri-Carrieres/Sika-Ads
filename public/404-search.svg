<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 440 340" fill="none">
  <style>
    .float { animation: float 4s ease-in-out infinite; }
    .float-late { animation: float 4.8s ease-in-out 0.6s infinite; }
    .orbit { transform-origin: 220px 170px; animation: orbit 24s linear infinite; }
    .pulse { animation: pulse 2.8s ease-in-out infinite; }
    @keyframes float { 0%, 100% { transform: translateY(0); } 50% { transform: translateY(-9px); } }
    @keyframes orbit { to { transform: rotate(360deg); } }
    @keyframes pulse { 0%, 100% { opacity: .55; transform: scale(.92); } 50% { opacity: 1; transform: scale(1.08); } }
    @media (prefers-reduced-motion: reduce) { *, *::before, *::after { animation: none !important; } }
  </style>
